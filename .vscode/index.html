<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculadora">
    <div class="display" id="display">0</div>

    <div class="botoes">
      <button class="btn funcao" onclick="limpar()">C</button>
      <button class="btn funcao" onclick="apagar()">⌫</button>
      <button class="btn funcao" onclick="porcento()">%</button>
      <button class="btn operador" onclick="operacao('/')">÷</button>

      <button class="btn" onclick="digito('7')">7</button>
      <button class="btn" onclick="digito('8')">8</button>
      <button class="btn" onclick="digito('9')">9</button>
      <button class="btn operador" onclick="operacao('*')">×</button>

      <button class="btn" onclick="digito('4')">4</button>
      <button class="btn" onclick="digito('5')">5</button>
      <button class="btn" onclick="digito('6')">6</button>
      <button class="btn operador" onclick="operacao('-')">-</button>

      <button class="btn" onclick="digito('1')">1</button>
      <button class="btn" onclick="digito('2')">2</button>
      <button class="btn" onclick="digito('3')">3</button>
      <button class="btn operador" onclick="operacao('+')">+</button>

      <button class="btn zero" onclick="digito('0')">0</button>
      <button class="btn" onclick="digito('.')">.</button>
      <button class="btn igual" onclick="calcular()">=</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
